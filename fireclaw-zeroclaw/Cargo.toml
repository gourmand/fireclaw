[package]
name = "fireclaw-zeroclaw"
version = "0.1.0"
edition = "2021"
description = "Fireclaw safety-net addon for ZeroClaw – blocks malware domains and email deletion"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
